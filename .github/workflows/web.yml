# Web sürümünü yayınlar: gh-pages dalındaki derlenmiş dosyaları GitHub Pages'e yükler.
name: Web sürümünü yayınla
# gh-pages dalına dosyalar yüklendikten sonra elle (veya API ile) başlatılır.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
